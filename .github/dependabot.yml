version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule: { interval: weekly }
    groups:
      next-security:
        patterns:
          - "next"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
