version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    # The repository uses a root npm workspace and root package-lock.json.
    # Tracking /apps/web alone updates a nested lock, leaving the root lock
    # inconsistent and failing scripts/check_npm_workspace_lock.py in CI.
    directory: "/"
    schedule: { interval: weekly }
    groups:
      next-security:
        patterns:
          - "next"
        update-types:
          - "minor"
          - "patch"
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: docker
    directory: "/docker"
    schedule: { interval: weekly }
