name: Refresh root npm lockfile

on:
  push:
    branches:
      - chore/sync-root-npm-lock
    paths:
      - package.json
      - apps/*/package.json
      - packages/*/package.json
      - .github/workflows/refresh-root-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/sync-root-npm-lock
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate root package lock
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Root lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh root npm lockfile"
          git push origin HEAD:chore/sync-root-npm-lock
