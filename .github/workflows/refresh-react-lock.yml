name: Refresh React lockfile

on:
  push:
    branches:
      - security/react-19-2-8
    paths:
      - apps/web/package.json
      - .github/workflows/refresh-react-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/react-19-2-8
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Regenerate package lock
        run: npm --prefix apps/web install --package-lock-only --legacy-peer-deps
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "chore(web): refresh React lockfile"
          git push origin HEAD:security/react-19-2-8
