name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/actionlint_${ACTIONLINT_VERSION}.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /tmp actionlint
          /tmp/actionlint -color
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: uv sync --dev
      - run: uv lock --check  # §46 dependency pinning
      - run: uv run python scripts/sync_vendor.py --check  # vendored dsa_* must match source
      # Node deps: tests/vscode runs `npm run compile` (tsc) and the web build
      # at the end need node_modules; clean runners have none installed.
      - run: npm --prefix apps/vscode ci --legacy-peer-deps
      - run: npm --prefix apps/web ci --legacy-peer-deps
      - run: uv run ruff check packages apps/api tests src apps/jupyter
      - run: uv run ruff format --check packages apps/api tests src apps/jupyter
      - run: uv run mypy packages apps/api src --ignore-missing-imports
      - run: uv run pytest -q --cov --cov-report=term-missing
      - run: uv run python scripts/generate_sbom.py && test -f release/sbom.json  # §47 SBOM
      - run: uv run dsa --limit 5 --out /tmp/ci-bench --catalog benchmarks/ds-agent-benchmark/catalog.json --datasets benchmarks/ds-agent-benchmark/datasets 2>&1 | tail -n 20
      - run: docker build -f docker/Dockerfile.api -t dsa-api:ci .
      - run: docker build -f docker/Dockerfile.web -t dsa-web:ci .
      - run: npm --prefix apps/web run build 2>&1 | tail -n 20
      - run: docker compose config 2>&1 | head -n 40
      - run: uv run python -m mkdocs build --strict 2>&1 | tail -n 50
