name: Prepare v4.3.0 RC

on:
  push:
    branches: [release/v4.3.0-rc]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Update canonical release surfaces
        run: |
          python scripts/prepare_v430_rc.py
          python scripts/patch_release_candidate_check.py
      - name: Regenerate lock, vendor, and SBOM
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv sync --dev --locked
          uv run python scripts/sync_vendor.py
          uv run python scripts/generate_sbom.py
          DSA_RELEASE_CANDIDATE=1 uv run python scripts/check_public_claims.py
      - name: Remove one-shot preparation files and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v430-rc.yml \
            scripts/prepare_v430_rc.py \
            scripts/patch_release_candidate_check.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: prepare v4.3.0 candidate"
          git push origin HEAD:release/v4.3.0-rc
