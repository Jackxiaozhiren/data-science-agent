name: Verify v4.3.0 Release Candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-verify-v4.3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    if: ${{ github.event.pull_request.number == 47 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install "uv==0.8.14"
      - run: uv sync --dev --locked
      - run: npm --prefix apps/web ci --legacy-peer-deps
      - name: Run final release verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/v4.3.0
          uv run dsa verify-release v4.3.0 --json | tee release/v4.3.0/verification.json
      - name: Upload verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v4.3.0-release-verification-${{ github.run_id }}
          path: release/v4.3.0/verification.json
          if-no-files-found: error
          retention-days: 30
