name: "Secret Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A push or PR run scans only the commit range its own event carries, and `cancel-in-progress` below means a
  # burst of pushes can leave an earlier range never scanned -- measured on 2026-10-23, when three heads lost
  # their scan that way (AUDIT_LEDGER.md 275). This run is the backstop: no event range, so gitleaks walks the
  # whole history that `fetch-depth: 0` checked out.
  schedule:
    - cron: "37 4 * * *"
  # The sweep had not produced a scheduled run as of 2026-10-24 07:14 UTC -- 2 h 37 min past its first slot, while
  # another workflow's schedule on this repository arrives ~5 h late every day (AUDIT_LEDGER.md 284). A dispatch
  # trigger is how the whole-history path gets witnessed at all rather than asserted: same checkout, same pinned
  # gitleaks, and the `SCOPE=` line says which event asked for it.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  # The push and PR groups keep cancelling, because those are fast feedback and a newer commit supersedes the
  # older scan. The sweep must not be cancellable: it is the only run whose coverage is the whole repository,
  # and an interrupted sweep would recreate the gap this trigger exists to close. A manual dispatch is the same
  # kind of run, so it is guarded the same way -- and its group name already keeps it out of the push group.
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: State what this run covers
        env:
          # Event fields travel as environment variables rather than being interpolated into the shell line: the
          # script then cannot be steered by whatever an event payload happens to contain.
          DSA_EVENT_NAME: ${{ github.event_name }}
          DSA_SHA: ${{ github.sha }}
        run: |
          case "$DSA_EVENT_NAME" in
            schedule) echo "SCOPE=whole history at $DSA_SHA" ;;
            workflow_dispatch) echo "SCOPE=whole history at $DSA_SHA (manual dispatch)" ;;
            *) echo "SCOPE=$DSA_EVENT_NAME payload range only; a cancelled run of this kind leaves that" \
              "range unscanned until the next 04:37 sweep" ;;
          esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # With this unset the action asks GitHub for gitleaks' latest release on every run, so the rule set
          # -- and the gate's verdict -- can change without a commit. Pinned to the version every run in this
          # repository's history has actually used.
          GITLEAKS_VERSION: "8.24.3"
