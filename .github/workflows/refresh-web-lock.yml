name: Refresh web lockfile

on:
  push:
    branches:
      - security/next-15.5.24-sharp-0.35.4

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
      - name: Resolve patched runtime dependencies
        working-directory: apps/web
        run: npm install next@15.5.24 sharp@0.35.4 --save-exact --package-lock-only --legacy-peer-deps
      - name: Show resolved versions and audit summary
        working-directory: apps/web
        run: |
          node -e "const l=require('./package-lock.json'); console.log(JSON.stringify(l.packages[''].dependencies, null, 2))"
          npm audit --json > /tmp/web-audit.json || true
          node -e "const a=require('/tmp/web-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2))"
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          git commit -m "security: refresh web lockfile" || exit 0
          git push
