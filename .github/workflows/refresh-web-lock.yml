name: Refresh web lockfile

on:
  push:
    branches:
      - security/next-15.5.24-sharp-0.35.4

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Refresh lockfile with patched runtime dependencies
        working-directory: apps/web
        run: npm install --legacy-peer-deps
      - name: Remove one-shot workflow and commit lockfile
        run: |
          rm .github/workflows/refresh-web-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json .github/workflows/refresh-web-lock.yml
          git commit -m "security: refresh web lockfile" || exit 0
          git push
