name: Actions Checkout Concurrency Probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-checkout-concurrency-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Confirm external action and concurrency startup
        run: echo "GitHub Actions runner started with a pinned action and concurrency enabled"
