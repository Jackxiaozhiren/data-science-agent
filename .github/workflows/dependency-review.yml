name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Dependency Review
        uses: actions/dependency-review-action@8912c3fa0fd11e3d8b37b7b6f0c9a5b6a7abb # v5.0.4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: always
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC, PSF, Python-2.0
