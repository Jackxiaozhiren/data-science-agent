name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: always
          # Sharp 0.35.x ships platform-specific libvips shared binaries under
          # LGPL-3.0-or-later. Next 16's Browserslist data also includes
          # caniuse-lite under CC-BY-4.0. Keep license enforcement enabled while
          # explicitly documenting these required upstream runtime/data licenses.
          #
          # The three identifiers below are recorded here because this project
          # ALREADY ships them; none was introduced by the bumps that surfaced
          # them. dependency-review only inspects the lock lines a PR changes, so
          # a routine bump makes an existing state look like a new violation:
          #   MPL-2.0                          certifi, shipped since 2026.7.22 and
          #                                    written in this repository's own
          #                                    release/sbom.json for that version.
          #   MIT-CMU                          pillow, shipped since 12.3.0 (PyPI
          #                                    reports the same expression for both
          #                                    12.3.0 and 13.0.0).
          #   LicenseRef-scancode-matplotlib-1.3.0   one term of matplotlib's
          #                                    compound expression. The label is
          #                                    synthesized by scancode from
          #                                    matplotlib's own license text, which
          #                                    has been "License agreement for
          #                                    matplotlib versions 1.3.0 and later"
          #                                    since 1.3.0 — so it applies to the
          #                                    3.11.1 main already ships too. It is
          #                                    deliberately version-tied: if
          #                                    matplotlib ever changes that text,
          #                                    this identifier stops matching and
          #                                    the gate reddens on purpose.
          # fail-on-severity and fail-on-scopes are unchanged by this: the gate
          # still blocks unknown licences and still only inspects runtime deps.
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC, Python-2.0, LGPL-3.0-or-later, CC-BY-4.0, MPL-2.0, MIT-CMU, LicenseRef-scancode-matplotlib-1.3.0
