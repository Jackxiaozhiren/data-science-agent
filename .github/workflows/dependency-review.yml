name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: always
          # Sharp ships platform libvips binaries under LGPL-3.0-or-later and
          # Browserslist metadata includes caniuse-lite under CC-BY-4.0.
          # Keep license enforcement enabled while allowing these required
          # upstream licenses alongside the repository's permissive set.
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC, Python-2.0, LGPL-3.0-or-later, CC-BY-4.0
