name: Actions Concurrency Probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-concurrency-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner startup with concurrency enabled
        run: echo "GitHub Actions runner started with concurrency enabled"
