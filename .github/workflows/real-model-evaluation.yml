name: Real Model Evaluation Smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnostic:
    name: secure Docker execution diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build existing API image
        run: docker build -f docker/Dockerfile.api -t dsa-eval:smoke .

      - name: Verify benchmark CLI in image
        run: docker run --rm dsa-eval:smoke .venv/bin/dsa --help
