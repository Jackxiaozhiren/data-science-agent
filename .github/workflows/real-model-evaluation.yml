name: Real Model Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model tier for all four variants"
        required: true
        default: gpt-5.6-luna
        type: choice
        options:
          - gpt-5.6-luna
          - gpt-5.6-terra
          - gpt-5.6-sol
      scope:
        description: "smoke-5 runs 5 tasks per variant; full runs the entire catalog"
        required: true
        default: smoke-5
        type: choice
        options:
          - smoke-5
          - full

permissions:
  contents: read

concurrency:
  group: real-model-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.variant.name }} / ${{ matrix.model.id }} / ${{ matrix.scope.name }}
    if: ${{ matrix.model.id == inputs.model && matrix.scope.name == inputs.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: dsa
            critic: "on"
          - name: dsa-no-critic
            critic: "off"
          - name: llm-tools
            critic: "on"
          - name: llm-only
            critic: "on"
        model:
          - id: gpt-5.6-luna
            input_cost_per_million: "0.20"
            output_cost_per_million: "1.20"
          - id: gpt-5.6-terra
            input_cost_per_million: "2.00"
            output_cost_per_million: "12.00"
          - id: gpt-5.6-sol
            input_cost_per_million: "4.00"
            output_cost_per_million: "20.00"
        scope:
          - name: smoke-5
            task_limit: "5"
          - name: full
            task_limit: "0"
    env:
      DSA_LLM_MODE: real
      DSA_LLM_PROVIDER: openai
      DSA_LLM_FALLBACK: error
      DSA_GIT_COMMIT: ${{ github.sha }}
      DSA_EVALUATION_VARIANT: ${{ matrix.variant.name }}
      DSA_EVIDENCE_CRITIC: ${{ matrix.variant.critic }}
      DSA_OPENAI_MODEL: ${{ matrix.model.id }}
      DSA_INPUT_COST_PER_MILLION: ${{ matrix.model.input_cost_per_million }}
      DSA_OUTPUT_COST_PER_MILLION: ${{ matrix.model.output_cost_per_million }}
      TASK_LIMIT: ${{ matrix.scope.task_limit }}
      PRICING_REFERENCE_DATE: "2026-08-29"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install "uv==0.12.7"

      - name: Install locked workspace
        run: uv sync --dev --locked

      - name: Run benchmark variant
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OUT_DIR: benchmark-artifacts/${{ matrix.variant.name }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY is not configured as a GitHub Actions secret."
            exit 1
          fi

          mkdir -p "${OUT_DIR}"
          cmd=(
            uv run dsa
            --catalog benchmarks/ds-agent-benchmark/catalog.json
            --datasets benchmarks/ds-agent-benchmark/datasets
            --out "${OUT_DIR}"
          )
          if [[ "${TASK_LIMIT}" != "0" ]]; then
            cmd+=(--limit "${TASK_LIMIT}")
          fi
          "${cmd[@]}"

      - name: Record workflow snapshot manifest
        if: ${{ always() }}
        shell: bash
        env:
          OUT_DIR: benchmark-artifacts/${{ matrix.variant.name }}
          VARIANT: ${{ matrix.variant.name }}
          RUN_SCOPE: ${{ matrix.scope.name }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          catalog = Path("benchmarks/ds-agent-benchmark/catalog.json")
          datasets = Path("benchmarks/ds-agent-benchmark/datasets")
          out = Path(os.environ["OUT_DIR"])

          catalog_sha256 = hashlib.sha256(catalog.read_bytes()).hexdigest()
          dataset_hasher = hashlib.sha256()
          dataset_files = sorted(p for p in datasets.rglob("*") if p.is_file())
          for path in dataset_files:
              relative = path.relative_to(datasets).as_posix()
              dataset_hasher.update(relative.encode("utf-8"))
              dataset_hasher.update(b"\0")
              dataset_hasher.update(hashlib.sha256(path.read_bytes()).digest())

          manifest = {
              "workflow": "Real Model Evaluation",
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "git_commit": os.environ.get("GITHUB_SHA"),
              "variant": os.environ["VARIANT"],
              "model": os.environ.get("DSA_OPENAI_MODEL"),
              "scope": os.environ["RUN_SCOPE"],
              "task_limit": int(os.environ["TASK_LIMIT"]),
              "catalog": str(catalog),
              "catalog_sha256": catalog_sha256,
              "datasets_dir": str(datasets),
              "datasets_sha256": dataset_hasher.hexdigest(),
              "dataset_file_count": len(dataset_files),
              "input_cost_per_million": os.environ.get("DSA_INPUT_COST_PER_MILLION"),
              "output_cost_per_million": os.environ.get("DSA_OUTPUT_COST_PER_MILLION"),
              "pricing_reference_date": os.environ["PRICING_REFERENCE_DATE"],
          }
          (out / "workflow_manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          PY

      - name: Upload benchmark artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-model-${{ matrix.variant.name }}-${{ matrix.model.id }}-${{ matrix.scope.name }}-${{ github.run_id }}
          path: benchmark-artifacts/${{ matrix.variant.name }}/
          if-no-files-found: error
          retention-days: 30
