name: Benchmark Leaderboard

on:
  pull_request:
    paths:
      - "benchmarks/leaderboard/**"
      - "scripts/render_leaderboard.py"
  push:
    branches: [main]
    paths:
      - "benchmarks/leaderboard/**"
      - "scripts/render_leaderboard.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate schema and generated table
        run: python scripts/render_leaderboard.py --check
