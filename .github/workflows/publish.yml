name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing (OIDC) — no long-lived token
      contents: write   # attach artifacts to the GitHub release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --dev
      # Node deps: tests/vscode runs `npm run compile` (tsc) and needs node_modules.
      - run: npm --prefix apps/vscode ci --legacy-peer-deps
      - run: npm --prefix apps/web ci --legacy-peer-deps
      # Verify the full gate on the exact tagged commit before publishing.
      - run: uv run mypy packages apps/api src --ignore-missing-imports
      - run: uv run ruff check packages apps/api tests src apps/jupyter
      - run: uv run pytest -q --cov --cov-report=term-missing
      # The umbrella is self-contained (dsa_* are vendored into the wheel), so
      # build only jack-data-science-agent and publish it — no separate dsa-*
      # distributions, and dist/ contains only the umbrella artifacts.
      - run: rm -rf dist && uv build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2 # release tag — GHCR image is tagged by release, not commit SHA
        with:
          packages-dir: dist/
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
