name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --dev
      - run: npm --prefix apps/vscode ci --legacy-peer-deps
      - run: npm --prefix apps/web ci --legacy-peer-deps
      - run: uv run mypy packages apps/api src --ignore-missing-imports
      - run: uv run ruff check packages apps/api tests src apps/jupyter
      - run: uv run pytest -q --cov --cov-report=term-missing
      - run: rm -rf dist && uv build
      - name: Fresh-wheel CLI and SDK smoke before publish
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/dsa-publish-smoke
          /tmp/dsa-publish-smoke/bin/python -m pip install --upgrade pip
          /tmp/dsa-publish-smoke/bin/python -m pip install dist/*.whl
          (
            cd /tmp
            /tmp/dsa-publish-smoke/bin/dsa --help >/dev/null
            /tmp/dsa-publish-smoke/bin/python -c 'import importlib.metadata; import data_science_agent; installed = importlib.metadata.version("jack-data-science-agent"); assert data_science_agent.__version__ == installed; assert data_science_agent.Agent().version == installed; print(f"publish wheel smoke: jack-data-science-agent {installed}")'
          )
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
      - name: Record immutable GitHub Release boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "PyPI is the canonical wheel/sdist distribution channel."
          echo "Published GitHub Releases in this repository are immutable, so post-publish binary asset uploads are intentionally skipped."
          echo "GitHub continues to provide immutable source archives for the tag."
      - name: Generate release announcement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/generate_release_announcement.py
