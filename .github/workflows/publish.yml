name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install "uv==0.12.7"
      - run: uv sync --dev
      - run: npm --prefix apps/vscode ci --legacy-peer-deps
      - run: npm --prefix apps/web ci --legacy-peer-deps
      - run: uv run mypy packages apps/api src --ignore-missing-imports
      - run: uv run ruff check packages apps/api tests src apps/jupyter
      - run: uv run pytest -q --cov --cov-report=term-missing
      - run: rm -rf dist && uv build
      - name: Fresh-wheel CLI and SDK smoke before publish
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/dsa-publish-smoke
          /tmp/dsa-publish-smoke/bin/python -m pip install --upgrade pip
          /tmp/dsa-publish-smoke/bin/python -m pip install dist/*.whl
          (
            cd /tmp
            /tmp/dsa-publish-smoke/bin/dsa --help >/dev/null
            /tmp/dsa-publish-smoke/bin/python -c 'import importlib.metadata; import data_science_agent; installed = importlib.metadata.version("jack-data-science-agent"); assert data_science_agent.__version__ == installed; assert data_science_agent.Agent().version == installed; print(f"publish wheel smoke: jack-data-science-agent {installed}")'
          )
      - name: Preserve built distributions as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
      - name: Attach distributions to mutable GitHub Release
        id: release_assets
        continue-on-error: true
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
      - name: Explain immutable GitHub Release fallback
        if: ${{ steps.release_assets.outcome == 'failure' }}
        run: echo "::notice::GitHub Release assets could not be attached (for example, because the release is immutable). The verified distributions remain available from PyPI and the release-dist workflow artifact."
      - name: Generate release announcement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/generate_release_announcement.py
