[project]
name = "data-science-agent"
version = "2.0.0"
description = "An Evidence-Grounded Autonomous Data Science System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "dsa-agent",
    "dsa-api",
    "dsa-datasets",
    "dsa-evaluation",
    "dsa-evidence",
    "dsa-execution",
    "dsa-llm",
    "dsa-mcp",
    "dsa-ml",
    "dsa-reports",
    "dsa-statistics",
    "dsa-tools",
    "dsa-visualization",
    "fastapi>=0.110",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "greenlet>=3.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "anyio>=4.4",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[tool.uv.workspace]
members = ["apps/api", "packages/agent", "packages/datasets", "packages/evaluation", "packages/evidence", "packages/execution", "packages/llm", "packages/mcp", "packages/ml", "packages/reports", "packages/statistics", "packages/tools", "packages/visualization"]

[tool.uv.sources]
dsa-agent = { workspace = true }
dsa-api = { workspace = true }
dsa-datasets = { workspace = true }
dsa-evaluation = { workspace = true }
dsa-evidence = { workspace = true }
dsa-execution = { workspace = true }
dsa-llm = { workspace = true }
dsa-mcp = { workspace = true }
dsa-ml = { workspace = true }
dsa-reports = { workspace = true }
dsa-statistics = { workspace = true }
dsa-tools = { workspace = true }
dsa-visualization = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/dsa_api/routers/*" = ["B008"]
"tests/**/*" = ["S101", "S108", "B017", "S608", "F841", "I001", "B905", "SIM105", "S110", "F401", "UP042", "UP046", "S311", "SIM102", "SIM103", "SIM110", "SIM222", "B904", "E402"]
"packages/agent/src/dsa_agent/*" = ["F841", "E402", "S110", "SIM102", "S608", "B904", "UP042"]
"packages/evaluation/**/*" = ["S110", "F841", "B905", "SIM105"]
"packages/evidence/**/*" = ["S110", "F841", "B904", "SIM102", "SIM105", "S608"]
"packages/execution/**/*" = ["S110", "S311", "SIM105", "UP042", "UP046", "S608", "B904"]
"packages/tools/**/*" = ["S110", "SIM105", "UP042", "UP046", "SIM102", "SIM103", "SIM110", "SIM222", "F401", "E402", "S608", "B904", "B905", "F841", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["dsa_api", "dsa_agent", "dsa_tools", "dsa_execution", "dsa_statistics", "dsa_ml", "dsa_viz", "dsa_evidence", "dsa_reports", "dsa_datasets", "dsa_llm", "dsa_mcp", "dsa_evaluation"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
addopts = "-q --asyncio-mode=auto"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore::DeprecationWarning:pydantic",
    "ignore::DeprecationWarning:sqlalchemy",
]

[tool.coverage.run]
source = ["packages", "apps/api/src"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.hatch.build.targets.wheel]
packages = ["src/data_science_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
