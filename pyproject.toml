[project]
name = "jack-data-science-agent"
version = "4.2.2"
description = "An Evidence-Grounded Autonomous Data Science System — from natural language to reproducible analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Data Science Agent Contributors", email = "jackxiaozhiren@users.noreply.github.com" }]
maintainers = [{ name = "Data Science Agent Maintainers", email = "jackxiaozhiren@users.noreply.github.com" }]
keywords = ["data-science", "agent", "llm", "reproducibility", "evidence", "benchmark", "mcp", "duckdb", "polars"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
]
dependencies = [
    "dsa-agent",
    "dsa-api",
    "dsa-datasets",
    "dsa-evaluation",
    "dsa-evidence",
    "dsa-execution",
    "dsa-llm",
    "dsa-mcp",
    "dsa-ml",
    "dsa-reports",
    "dsa-statistics",
    "dsa-tools",
    "dsa-visualization",
    "dsa-plugins",
    "fastapi>=0.110",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "greenlet>=3.5.5",
]
urls = { Homepage = "https://github.com/Jackxiaozhiren/data-science-agent", Repository = "https://github.com/Jackxiaozhiren/data-science-agent", Documentation = "https://github.com/Jackxiaozhiren/data-science-agent/blob/main/docs/getting-started.md", Changelog = "https://github.com/Jackxiaozhiren/data-science-agent/blob/main/CHANGELOG.md", Issues = "https://github.com/Jackxiaozhiren/data-science-agent/issues" }

[project.optional-dependencies]
jupyter = ["dsa-jupyter", "ipython>=8.0", "ipykernel>=6.0", "nest-asyncio>=1.5"]
time-series = ["statsmodels>=0.14"]
dev-jupyter = ["dsa-jupyter", "ipython>=8.0", "ipykernel>=6.0", "jupyterlab>=4.0", "nest-asyncio>=1.5"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "anyio>=4.4",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "dsa-jupyter",
    "ipython>=8.0",
    "nest-asyncio>=1.5",
]

[tool.uv.workspace]
members = ["apps/api", "apps/jupyter", "packages/agent", "packages/datasets", "packages/evaluation", "packages/evidence", "packages/execution", "packages/llm", "packages/mcp", "packages/ml", "packages/plugins", "packages/reports", "packages/statistics", "packages/tools", "packages/visualization"]

[tool.uv.sources]
dsa-agent = { workspace = true }
dsa-api = { workspace = true }
dsa-datasets = { workspace = true }
dsa-evaluation = { workspace = true }
dsa-evidence = { workspace = true }
dsa-execution = { workspace = true }
dsa-jupyter = { workspace = true }
dsa-llm = { workspace = true }
dsa-mcp = { workspace = true }
dsa-ml = { workspace = true }
dsa-reports = { workspace = true }
dsa-statistics = { workspace = true }
dsa-tools = { workspace = true }
dsa-visualization = { workspace = true }
dsa-plugins = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/dsa_api/routers/*" = ["B008", "S110", "SIM105"]
"tests/**/*" = ["S101", "S108", "B017", "S602", "S603", "S607", "S608", "F841", "I001", "B905", "SIM105", "S110", "F401", "UP042", "UP046", "S311", "SIM102", "SIM103", "SIM110", "SIM222", "B904", "E402", "E702", "B007", "S110"]
"packages/agent/src/dsa_agent/*" = ["F841", "E402", "S110", "SIM102", "S608", "B904", "UP042", "SIM105", "SIM222", "S311", "UP046", "B905"]
"packages/plugins/**/*" = ["S101", "S112", "S603", "S607", "S608", "F841", "B904", "SIM105", "SIM108", "SIM110", "S110", "F401", "E501"]
"packages/datasets/**/*" = ["S608", "UP042", "S110", "F841", "S311"]
"packages/evaluation/**/*" = ["S110", "F841", "B905", "SIM105", "S608", "UP042", "S311", "SIM110", "SIM103", "SIM210", "SIM108", "S603", "S607", "S602"]
"packages/evidence/**/*" = ["S110", "F841", "B904", "SIM102", "SIM105", "S608", "B905", "UP042", "E402"]
"packages/execution/**/*" = ["S110", "S311", "SIM105", "UP042", "UP046", "S608", "B904", "F401", "E402", "E702", "SIM102", "SIM103", "SIM110"]
"packages/llm/**/*" = ["S110"]
"packages/tools/**/*" = ["S110", "SIM105", "UP042", "UP046", "SIM102", "SIM103", "SIM110", "SIM222", "F401", "E402", "S608", "B904", "B905", "F841", "S311", "E702", "B007", "SIM103", "UP046"]
"packages/mcp/**/*" = ["S101", "S110", "S603", "S607", "F401", "I001", "B904", "E402", "SIM105"]
"apps/jupyter/**/*" = ["S101", "S112", "F401", "I001", "E501", "S603", "S607", "S110", "SIM105", "F841", "B904", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["dsa_api", "dsa_agent", "dsa_tools", "dsa_execution", "dsa_statistics", "dsa_ml", "dsa_viz", "dsa_evidence", "dsa_reports", "dsa_datasets", "dsa_llm", "dsa_mcp", "dsa_evaluation", "dsa_plugins"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Workspace is a multi-project src layout installed as PEP 660 editable shims;
# mypy cannot statically follow the .pth-based editable installs, so resolve all
# dsa_*/dsa_api packages deterministically from their source trees (fixes CI-only
# `no-any-return` where `dsa_api.models.*` was seen as Any).
mypy_path = "apps/api/src:apps/jupyter/src:packages/agent/src:packages/datasets/src:packages/evaluation/src:packages/evidence/src:packages/execution/src:packages/llm/src:packages/mcp/src:packages/ml/src:packages/plugins/src:packages/reports/src:packages/statistics/src:packages/tools/src:packages/visualization/src:src"

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
addopts = "-q --asyncio-mode=auto"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore::DeprecationWarning:pydantic",
    "ignore::DeprecationWarning:sqlalchemy",
]

[tool.coverage.run]
source = ["packages", "apps/api/src"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.hatch.build.targets.wheel]
packages = ["src/data_science_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
