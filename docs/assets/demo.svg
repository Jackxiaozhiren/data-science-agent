<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Data Science Agent terminal demo</title>
  <desc id="desc">An 18 second looping demo showing dataset profiling, planning, tool execution, evidence generation, claim checking, and report output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1000" height="560" rx="28" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="45" y="40" width="910" height="480" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="76" cy="70" r="7" fill="#f85149"/><circle cx="101" cy="70" r="7" fill="#d29922"/><circle cx="126" cy="70" r="7" fill="#3fb950"/>
    <text x="500" y="77" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">Data Science Agent — reproducible analysis</text>
    <line x1="65" y1="98" x2="935" y2="98" stroke="#30363d"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="74" y="133" fill="#3fb950" font-size="18">$</text>
    <text x="98" y="133" fill="#f0f6fc" font-size="18">dsa analyze sales.csv --task "Does price predict revenue?"</text>

    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.16;.20;.96;1"/>
      <text x="76" y="190" fill="#3fb950" font-size="18">✓</text><text x="110" y="190" fill="#f0f6fc" font-size="17" font-weight="600">Dataset profiled</text><text x="365" y="190" fill="#8b949e" font-size="15">12,480 rows · 9 columns · sha256: 9f41…c2d8</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.28;.32;.96;1"/>
      <text x="76" y="238" fill="#3fb950" font-size="18">✓</text><text x="110" y="238" fill="#f0f6fc" font-size="17" font-weight="600">Analysis plan created</text><text x="365" y="238" fill="#8b949e" font-size="15">profile → regression → significance → report</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.40;.44;.96;1"/>
      <text x="76" y="286" fill="#3fb950" font-size="18">✓</text><text x="110" y="286" fill="#f0f6fc" font-size="17" font-weight="600">Tools executed</text><text x="365" y="286" fill="#8b949e" font-size="15">DuckDB · SciPy · scikit-learn · visualization</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.52;.56;.96;1"/>
      <text x="76" y="334" fill="#3fb950" font-size="18">✓</text><text x="110" y="334" fill="#f0f6fc" font-size="17" font-weight="600">Evidence graph built</text><text x="365" y="334" fill="#8b949e" font-size="15">Insight → Evidence → ToolCall → Dataset</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.64;.68;.96;1"/>
      <text x="76" y="382" fill="#3fb950" font-size="18">✓</text><text x="110" y="382" fill="#f0f6fc" font-size="17" font-weight="600">Claims checked</text><text x="365" y="382" fill="#8b949e" font-size="15">unsupported causal claims: 0</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.76;.80;.96;1"/>
      <text x="76" y="430" fill="#3fb950" font-size="18">✓</text><text x="110" y="430" fill="#f0f6fc" font-size="17" font-weight="600">Report generated</text><text x="365" y="430" fill="#8b949e" font-size="15">report.md · evidence_graph.json · analysis.ipynb</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.84;.87;.96;1"/>
      <rect x="72" y="456" width="856" height="48" rx="9" fill="#12231a" stroke="#3fb950"/>
      <text x="92" y="486" fill="#56d364" font-size="16" font-weight="700">COMPLETED</text>
      <text x="222" y="486" fill="#f0f6fc" font-size="15">Price is significantly associated with revenue.</text>
      <text x="625" y="486" fill="#8b949e" font-size="13">evidence: regression#7 → 9f41…c2d8</text>
    </g>
  </g>

  <g>
    <rect x="74" y="154" width="850" height="4" rx="2" fill="#30363d"/>
    <rect x="74" y="154" width="0" height="4" rx="2" fill="#58a6ff"><animate attributeName="width" dur="18s" repeatCount="indefinite" values="0;850" keyTimes="0;1"/></rect>
  </g>

  <text x="500" y="542" text-anchor="middle" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">Ask · Analyze · Verify · Reproduce</text>
</svg>