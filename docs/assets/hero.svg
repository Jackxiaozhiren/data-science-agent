<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Data Science Agent</title>
  <desc id="desc">Evidence-grounded autonomous data science from natural-language question to reproducible report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#a371f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="48" r="180" fill="#58a6ff" opacity="0.06"/><circle cx="1170" cy="390" r="220" fill="#a371f7" opacity="0.055"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">
    <text x="72" y="92" fill="#8b949e" font-size="20" font-weight="600" letter-spacing="2">DATA SCIENCE AGENT</text>
    <text x="72" y="148" fill="#f0f6fc" font-size="44" font-weight="700">Ask your data.</text>
    <text x="72" y="198" fill="url(#accent)" font-size="44" font-weight="700">Verify the answer.</text>
    <text x="72" y="244" fill="#b1bac4" font-size="21">Autonomous data science with evidence, provenance,</text><text x="72" y="276" fill="#b1bac4" font-size="21">and reproducibility built into every run.</text>
    <g transform="translate(72 320)">
      <rect width="154" height="42" rx="21" fill="#1f6feb" opacity="0.18" stroke="#58a6ff"/><text x="77" y="27" text-anchor="middle" fill="#79c0ff" font-size="16" font-weight="600">Evidence-grounded</text>
      <rect x="166" width="132" height="42" rx="21" fill="#238636" opacity="0.16" stroke="#3fb950"/><text x="232" y="27" text-anchor="middle" fill="#56d364" font-size="16" font-weight="600">Reproducible</text>
      <rect x="310" width="116" height="42" rx="21" fill="#8957e5" opacity="0.16" stroke="#a371f7"/><text x="368" y="27" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="600">Local-first</text>
    </g>
    <g transform="translate(630 66)" filter="url(#shadow)">
      <rect width="500" height="304" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/><circle cx="28" cy="26" r="6" fill="#f85149"/><circle cx="50" cy="26" r="6" fill="#d29922"/><circle cx="72" cy="26" r="6" fill="#3fb950"/><text x="250" y="33" fill="#8b949e" font-size="15" text-anchor="middle">evidence pipeline</text>
      <g transform="translate(38 76)">
        <rect width="122" height="58" rx="12" fill="#161b22" stroke="#58a6ff"/><text x="61" y="25" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="600">Question</text><text x="61" y="44" text-anchor="middle" fill="#8b949e" font-size="12">natural language</text><path d="M132 29 H170" stroke="#484f58" stroke-width="2"/><path d="M165 24 L174 29 L165 34" fill="none" stroke="#484f58" stroke-width="2"/>
        <rect x="180" width="122" height="58" rx="12" fill="#161b22" stroke="#a371f7"/><text x="241" y="25" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="600">Tools</text><text x="241" y="44" text-anchor="middle" fill="#8b949e" font-size="12">SQL · Stats · ML</text><path d="M312 29 H350" stroke="#484f58" stroke-width="2"/><path d="M345 24 L354 29 L345 34" fill="none" stroke="#484f58" stroke-width="2"/>
        <rect x="360" width="102" height="58" rx="12" fill="#161b22" stroke="#3fb950"/><text x="411" y="25" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="600">Evidence</text><text x="411" y="44" text-anchor="middle" fill="#8b949e" font-size="12">traceable</text>
      </g>
      <path d="M449 156 V182 H100 V208" fill="none" stroke="#484f58" stroke-width="2"/><path d="M95 201 L100 210 L105 201" fill="none" stroke="#484f58" stroke-width="2"/>
      <g transform="translate(38 208)">
        <rect width="122" height="58" rx="12" fill="#161b22" stroke="#3fb950"/><text x="61" y="25" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="600">Critic</text><text x="61" y="44" text-anchor="middle" fill="#8b949e" font-size="12">claim checks</text><path d="M132 29 H170" stroke="#484f58" stroke-width="2"/><path d="M165 24 L174 29 L165 34" fill="none" stroke="#484f58" stroke-width="2"/>
        <rect x="180" width="122" height="58" rx="12" fill="#161b22" stroke="#58a6ff"/><text x="241" y="25" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="600">Report</text><text x="241" y="44" text-anchor="middle" fill="#8b949e" font-size="12">evidence-backed</text><path d="M312 29 H350" stroke="#484f58" stroke-width="2"/><path d="M345 24 L354 29 L345 34" fill="none" stroke="#484f58" stroke-width="2"/>
        <rect x="360" width="102" height="58" rx="12" fill="#161b22" stroke="#d29922"/><text x="411" y="25" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="600">Reproduce</text><text x="411" y="44" text-anchor="middle" fill="#8b949e" font-size="12">bundle</text>
      </g>
    </g>
    <text x="72" y="406" fill="#6e7681" font-size="15">Ask · Analyze · Verify · Reproduce</text>
  </g>
</svg>