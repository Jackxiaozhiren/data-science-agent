<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Data Science Agent social preview</title>
  <desc id="desc">Evidence-grounded autonomous data science from natural-language question to reproducible analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="36" fill="url(#glow)"/>

  <g transform="translate(84 88)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#accent)"/>
    <path d="M20 24h32M20 36h22M20 48h28" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

    <text x="96" y="34" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Data Science Agent</text>
    <text x="96" y="64" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Evidence-grounded autonomous data science</text>

    <text x="0" y="190" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="60" font-weight="800">Ask your data.</text>
    <text x="0" y="260" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="60" font-weight="800">Verify the answer.</text>

    <text x="0" y="318" fill="#c9d1d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">
      Natural language → SQL / statistics / ML → evidence → reproducible report
    </text>

    <g transform="translate(0 370)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">
      <rect x="0" y="0" width="150" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
      <text x="75" y="29" text-anchor="middle" fill="#58a6ff">Evidence</text>

      <rect x="166" y="0" width="178" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
      <text x="255" y="29" text-anchor="middle" fill="#3fb950">Reproducible</text>

      <rect x="360" y="0" width="112" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
      <text x="416" y="29" text-anchor="middle" fill="#d2a8ff">MCP</text>

      <rect x="488" y="0" width="150" height="44" rx="22" fill="#21262d" stroke="#30363d"/>
      <text x="563" y="29" text-anchor="middle" fill="#f2cc60">Local-first</text>
    </g>
  </g>

  <g transform="translate(840 152)">
    <rect x="0" y="0" width="330" height="330" rx="28" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="28" y="52" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">question</text>
    <text x="28" y="84" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">Does price predict</text>
    <text x="28" y="112" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">revenue?</text>

    <path d="M28 146h274" stroke="#30363d"/>
    <text x="28" y="180" fill="#58a6ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">✓ profile dataset</text>
    <text x="28" y="214" fill="#58a6ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">✓ execute tools</text>
    <text x="28" y="248" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">✓ build evidence</text>
    <text x="28" y="282" fill="#d2a8ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">✓ verify claims</text>

    <rect x="28" y="300" width="274" height="2" fill="url(#accent)"/>
  </g>
</svg>
