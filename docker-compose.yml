services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./artifacts:/app/artifacts"]
    env_file: [.env]
    environment:
      PORT: "8000"
      DATABASE_URL: "sqlite+aiosqlite:///./data/api.db"
      ARTIFACTS_DIR: "./artifacts"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: "http://api:8000"
