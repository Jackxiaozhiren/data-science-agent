services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./artifacts:/app/artifacts"]
    env_file: [.env]
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports: ["3000:3000"]
    depends_on: [api]
