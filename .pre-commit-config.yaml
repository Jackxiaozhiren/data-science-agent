# Opt-in local copies of the two formatter gates CI enforces. Install them with `uv run pre-commit install`;
# `pre-commit` is a dev dependency, so `uv sync --dev` provides it. Nothing here installs the hook for you, and a
# shared worktree is the place not to: `.git/hooks` is one file for every session in the checkout, so installing
# would start enforcing on commits this session did not author.
#
# The enforced copies are the CI steps `ruff check ...` and `ruff format --check ...` in
# `.github/workflows/ci.yml`; a contributor's local green has to agree with those, not with this file.
#
# The rev therefore has to track the version CI resolves, not drift behind it: an old ruff here would auto-fix
# files in the shape of a superseded formatter, turning "my hooks passed" into a CI red.
# `tests/test_pre_commit_rev_tracks_lock.py` compares this line against uv.lock, requires the guides below to
# document the install step, and pins the two hook ids to the two CI commands.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
