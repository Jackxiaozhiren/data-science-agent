[project]
name = "dsa-plugins"
version = "0.1.0"
description = "Plugin architecture for Data Science Agent"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsa_plugins"]
