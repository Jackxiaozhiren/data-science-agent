site_name: Data Science Agent
site_description: An Evidence-Grounded Autonomous Data Science System
site_url: https://example.com/data-science-agent/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.superfences
nav:
  - Home: README.md
  - Getting Started: docs/getting-started.md
  - Architecture: ARCHITECTURE_FREEZE_V0.1.md
  - Agent: docs/agent.md
  - Tools: docs/tools.md
  - Statistics: docs/statistics.md
  - Evidence: docs/evidence.md
  - MCP: docs/MCP_DESIGN.md
  - API: docs/api.md
  - Frontend: docs/FRONTEND_IA.md
  - Benchmark: benchmarks/ds-agent-benchmark/README.md
  - Security: docs/security.md
  - V2 Baseline: docs/v2/Baseline Report.md
  - V2 Evaluation: docs/v2/evaluation.md
  - V2 MCP 2026-28: docs/v2/MCP_2026_Audit.md
  - V2 Security: docs/v2/security.md
  - Benchmark v2: benchmarks/v2/README.md
  - Baseline: benchmarks/baseline/README.md
  - ADR: docs/ADR/ADR-001-mcp-2026-07-28-stateless-core.md
  - Research: docs/research.md
  - Examples: examples/README.md
  - Changelog: CHANGELOG.md
  - Contributing: CONTRIBUTING.md
  - Licenses: THIRD_PARTY_LICENSES.md
