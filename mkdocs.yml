site_name: Data Science Agent
site_description: An Evidence-Grounded Autonomous Data Science System
site_url: https://example.com/data-science-agent/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
markdown_extensions:
  - toc:
       permalink: true
  - tables
  - admonition
  - pymdownx.superfences
nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Agent: agent.md
  - Agent System: agent-system.md
  - Tools: tools.md
  - Statistics: statistics.md
  - Evidence: evidence.md
  - MCP: MCP_DESIGN.md
  - MCP Conformance: mcp.md
  - ADR: ADR/ADR-001-mcp-2026-07-28-stateless-core.md
  - API: api.md
  - Frontend: FRONTEND_IA.md
  - Security: security.md
  - Benchmark: benchmark.md
  - Evaluation: evaluation.md
  - Reproducibility: reproducibility.md
  - Research: research.md
  - Contributing: contributing.md

validation:
  links:
    not_found: ignore
    absolute_links: ignore
