site_name: Data Science Agent
site_description: An Evidence-Grounded Autonomous Data Science System
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
markdown_extensions:
  - toc:
       permalink: true
  - tables
  - admonition
  - pymdownx.superfences
nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - Product Tour: product-tour.md
  - Hosted Demo: hosted-demo.md
  - Architecture: architecture.md
  - Agent: agent.md
  - Agent System: agent-system.md
  - Tools: tools.md
  - Plugin Walkthrough: plugin-walkthrough.md
  - Statistics: statistics.md
  - Evidence: evidence.md
  - MCP: MCP_DESIGN.md
  - MCP Conformance: mcp.md
  - ADR: ADR/ADR-001-mcp-2026-07-28-stateless-core.md
  - API: api.md
  - Frontend: FRONTEND_IA.md
  - Security: security.md
  - Benchmark:
      - Overview: benchmark.md
      - Contribute a Task: benchmark-task-contribution.md
  - Evaluation:
      - Overview: evaluation.md
      - Real-model Evaluation: real-model-evaluation.md
      - Reproducibility: reproducibility.md
  - Research: research.md
  - Contributing: contributing.md

validation:
  links:
    not_found: ignore
    absolute_links: ignore
