site_name: Data Science Agent
site_description: An Evidence-Grounded Autonomous Data Science System
site_url: https://example.com/data-science-agent/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
markdown_extensions:
  - toc:
       permalink: true
  - tables
  - admonition
  - pymdownx.superfences
nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Agent: agent.md
  - Tools: tools.md
  - Statistics: statistics.md
  - Evidence: evidence.md
  - MCP: MCP_DESIGN.md
  - API: api.md
  - Frontend: FRONTEND_IA.md
  - Security: security.md
  - V2 Baseline: v2/Baseline Report.md
  - V2 Evaluation: v2/evaluation.md
  - V2 MCP 2026-28: v2/MCP_2026_Audit.md
  - V2 Security: v2/security.md
  - V3 Baseline: v3/V2_FINAL_BASELINE.md
  - V3 Benchmark Audit: v3/BENCHMARK_AUDIT.md
  - V3 Reproduction: v3/REPRODUCTION.md
  - V3 Statistical: v3/STATISTICAL_EVALUATION.md
  - V3 Reliability: v3/RELIABILITY.md
  - V3 Cross-Model: v3/CROSS_MODEL.md
  - V3 Human Eval: v3/HUMAN_EVALUATION_GUIDE.md
  - V3 External: v3/EXTERNAL_VALIDATION.md
  - Research: research.md

validation:
  links:
    not_found: ignore
    absolute_links: ignore
