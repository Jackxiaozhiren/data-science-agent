site_name: Data Science Agent
site_description: An Evidence-Grounded Autonomous Data Science System
site_url: https://example.com/data-science-agent/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
markdown_extensions:
  - toc:
       permalink: true
  - tables
  - admonition
  - pymdownx.superfences
nav:
  - Home: README.md
  - Getting Started: docs/getting-started.md
  - Architecture: docs/architecture.md
  - Agent: docs/agent.md
  - Tools: docs/tools.md
  - Statistics: docs/statistics.md
  - Evidence: docs/evidence.md
  - MCP: docs/MCP_DESIGN.md
  - API: docs/api.md
  - Frontend: docs/FRONTEND_IA.md
  - Security: docs/security.md
  - V2 Baseline: docs/v2/Baseline Report.md
  - V2 Evaluation: docs/v2/evaluation.md
  - V2 MCP 2026-28: docs/v2/MCP_2026_Audit.md
  - V2 Security: docs/v2/security.md
  - V3 Baseline: docs/v3/V2_FINAL_BASELINE.md
  - V3 Benchmark Audit: docs/v3/BENCHMARK_AUDIT.md
  - V3 Reproduction: docs/v3/REPRODUCTION.md
  - V3 Statistical: docs/v3/STATISTICAL_EVALUATION.md
  - V3 Reliability: docs/v3/RELIABILITY.md
  - V3 Cross-Model: docs/v3/CROSS_MODEL.md
  - V3 Human Eval: docs/v3/HUMAN_EVALUATION_GUIDE.md
  - V3 External: docs/v3/EXTERNAL_VALIDATION.md
  - Research: docs/research.md
