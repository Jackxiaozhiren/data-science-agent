# Render Blueprint for the public demo API.
services:
  - type: web
    name: data-science-agent-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    dockerCommand: /bin/sh -c '.venv/bin/uvicorn dsa_api.main:app --host 0.0.0.0 --port ${PORT:-10000}'
    healthCheckPath: /health
    envVars:
      - key: DSA_LLM_MODE
        value: heuristic
      - key: DSA_LLM_FALLBACK
        value: heuristic
      - key: DSA_CORS_ORIGINS
        sync: false
