# Render Blueprint for the public demo API.
services:
  - type: web
    name: data-science-agent-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DSA_LLM_MODE
        value: heuristic
      - key: DSA_LLM_FALLBACK
        value: heuristic
      - key: DSA_DATABASE_URL
        value: sqlite+aiosqlite:////tmp/dsa.db
      # All three writable roots are named, not left to the image defaults. The dataset and artifact
      # directories would otherwise land under /app, which this predicate does not recognise as a
      # throwaway path -- so /version and the web badge said `database` was ephemeral while charts,
      # notebooks and reproduce.sh sat on a container filesystem that is just as temporary. Saying
      # /tmp here makes the disclosure complete; attaching a disk (deploy/render-persistent.example.yaml)
      # is what moves all three onto real storage.
      - key: DSA_DATASET_DIR
        value: /tmp/datasets
      - key: DSA_ARTIFACT_ROOT
        value: /tmp/artifacts
      - key: PYTHONUNBUFFERED
        value: "1"
      # Browser origins allowed to call the API. Explicit production origin --
      # the host README links -- plus a regex covering every other
      # `*.vercel.app`, which is how the second live hostname and each
      # preview keep working without being enumerated here. Demo API carries
      # no credentials; CORS here is browser UX, not access control.
      - key: DSA_CORS_ORIGINS
        value: https://data-science-agent-web.vercel.app
      - key: DSA_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
