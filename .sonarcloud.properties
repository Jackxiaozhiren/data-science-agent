# SonarQube Cloud automatic-analysis configuration.
#
# src/data_science_agent/_vendor is generated from packages/* by
# scripts/sync_vendor.py and intentionally duplicates the canonical source.
# Keep generated vendored code analyzable, but exclude it from copy/paste
# detection so the duplication quality gate measures authored source code.
sonar.cpd.exclusions=src/data_science_agent/_vendor/**/*
